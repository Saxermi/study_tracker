name: Tests
on:
  push:
  pull_request:
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compilation
        run: python -m py_compile server.py scripts/add_tasks.py
      - name: Unit and HTTP tests
        run: python -m unittest discover -s tests -v

  time-analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        run: |
          node --check static/app.js
          node --check static/i18n.js
          node --check static/exercise_review_import.js
          node --check static/rich_feedback.js
          node --check static/import_wizard.js
          TZ=Europe/Zurich node --test tests/*.cjs
